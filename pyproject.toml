[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dietlens"
version = "0.2.0"
description = "DietLens deterministic agent harness"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.20,<5", "python-dotenv>=1,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
cloud = ["psycopg[binary]>=3.2,<4"]
server = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1"]

[tool.setuptools.packages.find]
include = ["dietlens_mvp*"]

[tool.setuptools.package-data]
dietlens_mvp = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
