<text x="25" y="326" font-family="Microsoft YaHei,sans-serif" font-size="17" font-weight="400" fill="#6f6b63" dominant-baseline="text-before-edge">食材库存</text>
<rect x="12" y="377" width="146" height="46" rx="12" fill="#f3e1d9" stroke="#f3e1d9"/>
<text x="25" y="387" font-family="Microsoft YaHei,sans-serif" font-size="17" font-weight="700" fill="#b24e32" dominant-baseline="text-before-edge">餐食记录</text>
<text x="25" y="448" font-family="Microsoft YaHei,sans-serif" font-size="17" font-weight="400" fill="#6f6b63" dominant-baseline="text-before-edge">阶段回顾</text>
<text x="25" y="509" font-family="Microsoft YaHei,sans-serif" font-size="17" font-weight="400" fill="#6f6b63" dominant-baseline="text-before-edge">设置</text>
<text x="206" y="28" font-family="Microsoft YaHei,sans-serif" font-size="12" font-weight="400" fill="#6f6b63" dominant-baseline="text-before-edge">第二次作业 / 目标设计稿</text>
<text x="206" y="66" font-family="Microsoft YaHei,sans-serif" font-size="29" font-weight="700" fill="#24231f" dominant-baseline="text-before-edge">一餐，记录多种实际食物</text>
<text x="206" y="111" font-family="Microsoft YaHei,sans-serif" font-size="16" font-weight="400" fill="#6f6b63" dominant-baseline="text-before-edge">2026-11-18 午餐 · 由计划预填后核对 · 尚未保存</text>
<text x="206" y="784" font-family="Microsoft YaHei,sans-serif" font-size="13" font-weight="400" fill="#6f6b63" dominant-baseline="text-before-edge">目标设计稿 · 示例数据 · 非实际运行截图</text>
<rect x="206" y="158" width="854" height="112" rx="12" fill="#ffffff" stroke="#dfdbd2"/>
<text x="230" y="180" font-family="Microsoft YaHei,sans-serif" font-size="20" font-weight="700" fill="#24231f" dominant-baseline="text-before-edge">只记录我个人实际吃的</text>
<text x="230" y="223" font-family="Microsoft YaHei,sans-serif" font-size="17" font-weight="400" fill="#6f6b63" dominant-baseline="text-before-edge">两人备餐量不作为个人摄入；同餐可添加多条食物。</text>
<rect x="206" y="290" width="854" height="272" rx="12" fill="#ffffff" stroke="#dfdbd2"/>
<text x="230" y="311" font-family="Microsoft YaHei,sans-serif" font-size="17" font-weight="700" fill="#24231f" dominant-baseline="text-before-edge">食物</text>
<text x="545" y="311" font-family="Microsoft YaHei,sans-serif" font-size="17" font-weight="700" fill="#24231f" dominant-baseline="text-before-edge">我的实际份量</text>
<text x="850" y="311" font-family="Microsoft YaHei,sans-serif" font-size="17" font-weight="700" fill="#24231f" dominant-baseline="text-before-edge">来源</text>
<text x="230" y="363" font-family="Microsoft YaHei,sans-serif" font-size="17" font-weight="400" fill="#24231f" dominant-baseline="text-before-edge">番茄鸡蛋面</text>
<text x="545" y="363" font-family="Microsoft YaHei,sans-serif" font-size="17" font-weight="400" fill="#24231f" dominant-baseline="text-before-edge">1 份</text>
<text x="850" y="363" font-family="Microsoft YaHei,sans-serif" font-size="17" font-weight="400" fill="#24231f" dominant-baseline="text-before-edge">计划预填后核对</text>
<text x="230" y="420" font-family="Microsoft YaHei,sans-serif" font-size="17" font-weight="400" fill="#24231f" dominant-baseline="text-before-edge">无糖茶</text>
<text x="545" y="420" font-family="Microsoft YaHei,sans-serif" font-size="17" font-weight="400" fill="#24231f" dominant-baseline="text-before-edge">300 mL</text>
<text x="850" y="420" font-family="Microsoft YaHei,sans-serif" font-size="17" font-weight="400" fill="#24231f" dominant-baseline="text-before-edge">用户手输</text>
<text x="230" y="477" font-family="Microsoft YaHei,sans-serif" font-size="17" font-weight="400" fill="#24231f" dominant-baseline="text-before-edge">苹果</text>
<text x="545" y="477" font-family="Microsoft YaHei,sans-serif" font-size="17" font-weight="400" fill="#24231f" dominant-baseline="text-before-edge">未知</text>
<text x="850" y="477" font-family="Microsoft YaHei,sans-serif" font-size="17" font-weight="400" fill="#24231f" dominant-baseline="text-before-edge">用户手输</text>
<text x="230" y="525" font-family="Microsoft YaHei,sans-serif" font-size="16" font-weight="400" fill="#6f6b63" dominant-baseline="text-before-edge">＋ 添加食物     ·     修改或移除条目后重新核对整份餐食。</text>
<rect x="230" y="591" width="190" height="46" rx="12" fill="#b24e32" stroke="#b24e32"/>
<text x="248" y="604" font-family="Microsoft YaHei,sans-serif" font-size="16" font-weight="700" fill="#ffffff" dominant-baseline="text-before-edge">预览这一餐</text>
<rect x="445" y="591" width="190" height="46" rx="12" fill="#f1eee8" stroke="#f1eee8"/>
<text x="463" y="604" font-family="Microsoft YaHei,sans-serif" font-size="16" font-weight="700" fill="#24231f" dominant-baseline="text-before-edge">取消，不保存</text>
<rect x="206" y="663" width="854" height="95" rx="12" fill="#ffffff" stroke="#dfdbd2"/>
<text x="230" y="685" font-family="Microsoft YaHei,sans-serif" font-size="20" font-weight="700" fill="#24231f" dominant-baseline="text-before-edge">确认边界</text>
<text x="230" y="728" font-family="Microsoft YaHei,sans-serif" font-size="17" font-weight="400" fill="#6f6b63" dominant-baseline="text-before-edge">核对预览后再保存；不扣库存，也不自动完成微行动。</text>
</svg>