<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="820" viewBox="0 0 1100 820">
<rect x="0" y="0" width="1100" height="820" rx="12" fill="#f7f6f2" stroke="#f7f6f2"/>
<rect x="0" y="0" width="172" height="820" rx="0" fill="#ffffff" stroke="#ffffff"/>
<text x="22" y="30" font-family="Microsoft YaHei,sans-serif" font-size="25" font-weight="700" fill="#b24e32" dominant-baseline="text-before-edge">DietLens</text>
<text x="22" y="72" font-family="Microsoft YaHei,sans-serif" font-size="12" font-weight="400" fill="#6f6b63" dominant-baseline="text-before-edge">好好吃饭，慢慢改变</text>
<rect x="12" y="133" width="146" height="46" rx="12" fill="#f3e1d9" stroke="#f3e1d9"/>
<text x="25" y="143" font-family="Microsoft YaHei,sans-serif" font-size="17" font-weight="700" fill="#b24e32" dominant-baseline="text-before-edge">今日饮食</text>
<text x="25" y="204" font-family="Microsoft YaHei,sans-serif" font-size="17" font-weight="400" fill="#6f6b63" dominant-baseline="text-before-edge">饮食计划</text>
<text x="25" y="265" font-family="Microsoft YaHei,sans-serif" font-size="17" font-weight="400" fill="#6f6b63" dominant-baseline="text-before-edge">食品资料</text>
<text x="25" y="326" font-family="Microsoft YaHei,sans-serif" font-size="17" font-weight="400" fill="#6f6b63" dominant-baseline="text-before-edge">食材库存</text>
<text x="25" y="387" font-family="Microsoft YaHei,sans-serif" font-size="17" font-weight="400" fill="#6f6b63" dominant-baseline="text-before-edge">餐食记录</text>
<text x="25" y="448" font-family="Microsoft YaHei,sans-serif" font-size="17" font-weight="400" fill="#6f6b63" dominant-baseline="text-before-edge">阶段回顾</text>
<text x="25" y="509" font-family="Microsoft YaHei,sans-serif" font-size="17" font-weight="400" fill="#6f6b63" dominant-baseline="text-before-edge">设置</text>
<text x="206" y="28" font-family="Microsoft YaHei,sans-serif" font-size="12" font-weight="400" fill="#6f6b63" dominant-baseline="text-before-edge">第二次作业 / 目标设计稿</text>
<text x="206" y="66" font-family="Microsoft YaHei,sans-serif" font-size="29" font-weight="700" fill="#24231f" dominant-baseline="text-before-edge">先确认一个小行动</text>
<text x="206" y="111" font-family="Microsoft YaHei,sans-serif" font-size="16" font-weight="400" fill="#6f6b63" dominant-baseline="text-before-edge">候选方案 · 不计完成 · 可修改、换一个或跳过</text>
<text x="206" y="784" font-family="Microsoft YaHei,sans-serif" font-size="13" font-weight="400" fill="#6f6b63" dominant-baseline="text-before-edge">目标设计稿 · 示例数据 · 非实际运行截图</text>
<rect x="206" y="158" width="854" height="157" rx="12" fill="#ffffff" stroke="#dfdbd2"/>
<text x="230" y="180" font-family="Microsoft YaHei,sans-serif" font-size="20" font-weight="700" fill="#24231f" dominant-baseline="text-before-edge">拿饮料时，换成白水</text>
<text x="230" y="223" font-family="Microsoft YaHei,sans-serif" font-size="17" font-weight="400" fill="#6f6b63" dominant-baseline="text-before-edge">线索：明天午餐拿饮料时；行为：本次饮品选择白水</text>
<text x="230" y="257" font-family="Microsoft YaHei,sans-serif" font-size="17" font-weight="400" fill="#6f6b63" dominant-baseline="text-before-edge">努力量：低，只改饮品；依据：你确认的减少含糖饮料目标</text>
<rect x="206" y="336" width="854" height="160" rx="12" fill="#ffffff" stroke="#dfdbd2"/>
<text x="230" y="358" font-family="Microsoft YaHei,sans-serif" font-size="20" font-weight="700" fill="#24231f" dominant-baseline="text-before-edge">这次行动，什么时候结束？</text>
<text x="230" y="401" font-family="Microsoft YaHei,sans-serif" font-size="17" font-weight="400" fill="#6f6b63" dominant-baseline="text-before-edge">建议窗口：2026-11-18 11:00 至 14:00（亚洲 / 上海）</text>
<text x="230" y="435" font-family="Microsoft YaHei,sans-serif" font-size="17" font-weight="400" fill="#6f6b63" dominant-baseline="text-before-edge">可以修改开始和结束时间；没有统一24小时反馈窗口。</text>
<rect x="230" y="531" width="190" height="46" rx="12" fill="#f1eee8" stroke="#f1eee8"/>
<text x="248" y="544" font-family="Microsoft YaHei,sans-serif" font-size="16" font-weight="700" fill="#24231f" dominant-baseline="text-before-edge">修改窗口</text>
<rect x="445" y="531" width="190" height="46" rx="12" fill="#f1eee8" stroke="#f1eee8"/>
<text x="463" y="544" font-family="Microsoft YaHei,sans-serif" font-size="16" font-weight="700" fill="#24231f" dominant-baseline="text-before-edge">换一个</text>
<rect x="660" y="531" width="190" height="46" rx="12" fill="#f1eee8" stroke="#f1eee8"/>
<text x="678" y="544" font-family="Microsoft YaHei,sans-serif" font-size="16" font-weight="700" fill="#24231f" dominant-baseline="text-before-edge">跳过</text>
<rect x="230" y="613" width="220" height="46" rx="12" fill="#b24e32" stroke="#b24e32"/>
<text x="248" y="626" font-family="Microsoft YaHei,sans-serif" font-size="16" font-weight="700" fill="#ffffff" dominant-baseline="text-before-edge">预览并确认采纳</text>
<text x="230" y="701" font-family="Microsoft YaHei,sans-serif" font-size="16" font-weight="400" fill="#6f6b63" dominant-baseline="text-before-edge">采纳后进入待反馈；窗口到期未反馈为未知，支持迟到补报。</text>
</svg>