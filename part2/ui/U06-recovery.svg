<text x="25" y="326" font-family="Microsoft YaHei,sans-serif" font-size="17" font-weight="400" fill="#6f6b63" dominant-baseline="text-before-edge">食材库存</text>
<rect x="12" y="377" width="146" height="46" rx="12" fill="#f3e1d9" stroke="#f3e1d9"/>
<text x="25" y="387" font-family="Microsoft YaHei,sans-serif" font-size="17" font-weight="700" fill="#b24e32" dominant-baseline="text-before-edge">餐食记录</text>
<text x="25" y="448" font-family="Microsoft YaHei,sans-serif" font-size="17" font-weight="400" fill="#6f6b63" dominant-baseline="text-before-edge">阶段回顾</text>
<text x="25" y="509" font-family="Microsoft YaHei,sans-serif" font-size="17" font-weight="400" fill="#6f6b63" dominant-baseline="text-before-edge">设置</text>
<text x="206" y="28" font-family="Microsoft YaHei,sans-serif" font-size="12" font-weight="400" fill="#6f6b63" dominant-baseline="text-before-edge">第二次作业 / 目标设计稿</text>
<text x="206" y="66" font-family="Microsoft YaHei,sans-serif" font-size="29" font-weight="700" fill="#24231f" dominant-baseline="text-before-edge">先核对保存结果</text>
<text x="206" y="111" font-family="Microsoft YaHei,sans-serif" font-size="16" font-weight="400" fill="#6f6b63" dominant-baseline="text-before-edge">快速记餐 · 网络在确认后中断 · 填写内容已保留</text>
<text x="206" y="784" font-family="Microsoft YaHei,sans-serif" font-size="13" font-weight="400" fill="#6f6b63" dominant-baseline="text-before-edge">目标设计稿 · 示例数据 · 非实际运行截图</text>
<rect x="206" y="158" width="854" height="141" rx="12" fill="#fff7e6" stroke="#dfdbd2"/>
<text x="230" y="185" font-family="Microsoft YaHei,sans-serif" font-size="23" font-weight="700" fill="#9a6b1d" dominant-baseline="text-before-edge">正在核对是否保存</text>
<text x="230" y="238" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#24231f" dominant-baseline="text-before-edge">暂时没有收到服务器回执，核对后会显示原记录。</text>
<rect x="206" y="322" width="854" height="160" rx="12" fill="#ffffff" stroke="#dfdbd2"/>
<text x="230" y="344" font-family="Microsoft YaHei,sans-serif" font-size="20" font-weight="700" fill="#24231f" dominant-baseline="text-before-edge">你刚才确认的内容</text>
<text x="230" y="387" font-family="Microsoft YaHei,sans-serif" font-size="17" font-weight="400" fill="#6f6b63" dominant-baseline="text-before-edge">2026-11-18 午餐 · 番茄鸡蛋面 · 份量未知</text>
<text x="230" y="421" font-family="Microsoft YaHei,sans-serif" font-size="17" font-weight="400" fill="#6f6b63" dominant-baseline="text-before-edge">原确认请求会被复用，保持同一份记录。</text>
<rect x="230" y="519" width="190" height="46" rx="12" fill="#b24e32" stroke="#b24e32"/>
<text x="248" y="532" font-family="Microsoft YaHei,sans-serif" font-size="16" font-weight="700" fill="#ffffff" dominant-baseline="text-before-edge">核对保存结果</text>
<rect x="445" y="519" width="230" height="46" rx="12" fill="#f1eee8" stroke="#f1eee8"/>
<text x="463" y="532" font-family="Microsoft YaHei,sans-serif" font-size="16" font-weight="700" fill="#24231f" dominant-baseline="text-before-edge">保留草稿，稍后继续</text>
<rect x="206" y="602" width="854" height="139" rx="12" fill="#ffffff" stroke="#dfdbd2"/>
<text x="230" y="624" font-family="Microsoft YaHei,sans-serif" font-size="20" font-weight="700" fill="#24231f" dominant-baseline="text-before-edge">如果发现资料已经变化</text>
<text x="230" y="667" font-family="Microsoft YaHei,sans-serif" font-size="17" font-weight="400" fill="#6f6b63" dominant-baseline="text-before-edge">展示变化字段，重新核对并预览，再确认保存。</text>
<text x="230" y="701" font-family="Microsoft YaHei,sans-serif" font-size="17" font-weight="400" fill="#6f6b63" dominant-baseline="text-before-edge">模型或查询失败可手输；数据库不可用时保留草稿。</text>
</svg>