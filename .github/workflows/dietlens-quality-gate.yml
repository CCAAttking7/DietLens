name: DietLens quality gate

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]

jobs:
  frontend-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: npm ci
      - run: npm ci --prefix web
      # GitHub-hosted Ubuntu runners already provide Chromium's system libraries;
      # install the pinned project browser without a privileged apt phase.
      - run: npx playwright install chromium
      - run: npm run qa:build
      - run: npm run qa:contrast
      - run: npm run qa:syntax
      - name: Start frontend preview
        run: |
          npm --prefix web run preview -- --host 127.0.0.1 --port 5174 > /tmp/dietlens-preview.log 2>&1 &
          for attempt in $(seq 1 30); do curl --fail --silent http://127.0.0.1:5174/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/dietlens-preview.log
          exit 1
      - run: npm run qa:browser
        env:
          DIETLENS_PREVIEW_URL: http://127.0.0.1:5174/
          DIETLENS_ARTIFACT_DIR: ${{ github.workspace }}/artifacts/dietlens-round-3
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dietlens-round-3-browser-evidence
          path: artifacts/dietlens-round-3
          if-no-files-found: warn
